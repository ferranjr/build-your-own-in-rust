[workspace]
resolver = "2"
members = [
    "load-balancer",
    "server"
]

[workspace.dependencies]
tokio = { version = "1.50.0", features = ["full"] }
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"